[project]
name = "jproteina-complexa"
version = "0.1.0"
description = "JAX/Equinox protein binder design (Proteina-Complexa port)"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.10.0",
    "equinox>=0.11.0",
    "einops>=0.6",
    "jaxtyping",
    "numpy>=1.23",
    "gemmi",
    "huggingface_hub",
]

[project.optional-dependencies]
# GPU support is opt-in so CPU/macOS consumers aren't forced onto CUDA-only
# wheels: install `jproteina-complexa[cuda]` (or add `jax[cuda12]` yourself).
cuda = ["jax[cuda12]>=0.10.0"]
convert = [
    "torch",
    "scipy",
    "omegaconf",
    "dm-tree",
    "loguru",
    "biopython",
    "loralib>=0.1.2",
]

[project.scripts]
jpc-generate = "jproteina_complexa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jproteina_complexa"]
